name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # L'application Laravel vit dans un sous-dossier du dépôt.
    defaults:
      run:
        working-directory: projet-vin

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4.24'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projet-vin/package-lock.json

      # « composer setup » lance aussi « migrate --force », qui exigerait un
      # MySQL ici. Les tests tournent sur SQLite en mémoire (phpunit.xml), la
      # base n'est donc pas nécessaire.
      - name: Setup Application
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check
