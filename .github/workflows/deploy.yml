name: deploy

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lws-ftps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projet-vin

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.24'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projet-vin/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare build environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare deploy payload
        run: |
          rm -rf .env public/hot node_modules tests docs .agents
          find storage -type f ! -name ".gitignore" -delete
          find storage -type d -empty -delete
          mkdir -p ../deploy-payload
          zip -qr ../deploy-payload/deploy.zip .

      - name: Upload deploy archive with FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.LWS_FTP_SERVER }}
          username: ${{ secrets.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy-payload/
          server-dir: ${{ secrets.LWS_FTP_DIR }}
          state-name: .ftp-deploy-zip-state.json
          exclude: |
            **/.git*
            **/.git*/**

      - name: Run Laravel deploy commands
        env:
          DEPLOY_URL: ${{ secrets.LWS_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.LWS_DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_TOKEN"
          status=$(curl --silent --show-error --max-time 300 \
            --output response.json --write-out '%{http_code}' \
            --request POST "$DEPLOY_URL" \
            --header "X-Deploy-Token: $DEPLOY_TOKEN" \
            --header "X-Deploy-Version: $DEPLOY_SHA")
          echo "HTTP $status"
          cat response.json
          echo
          test "$status" = "200"
